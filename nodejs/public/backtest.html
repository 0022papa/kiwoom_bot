<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>백테스팅 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        .loader { border-top-color: #6366f1; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        input:focus { outline: 2px solid #6366f1; outline-offset: -1px; }
        .dark ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen p-4 transition-colors duration-200">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-2">
                📊 백테스팅 시뮬레이터
            </h1>
            <div class="flex items-center gap-3">
                <button id="theme-toggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors">
                    <svg id="theme-toggle-dark-icon" class="hidden h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.121-1.414a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM3.05 13.657l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414-1.414zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm.293-7.293l.707.707a1 1 0 011.414-1.414l-.707-.707a1 1 0 01-1.414 1.414z"></path></svg>
                </button>
                <a href="/" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors font-medium text-sm">
                    ↩ 대시보드로 복귀
                </a>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6 mb-6 border border-slate-200 dark:border-slate-700">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                📝 테스트 조건 입력
                <span class="text-xs font-normal text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full">과거 시점 시뮬레이션</span>
            </h2>
            
            <!-- 🌟 [추가] 분석 모드 선택 -->
            <div class="flex flex-col gap-4 mb-4 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600">
                <div class="flex flex-col sm:flex-row gap-6 items-center">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-slate-500 dark:text-slate-400">분석 모드:</span>
                    </div>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" name="bt_mode" value="simulation" checked class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                            <span class="text-sm font-bold text-slate-700 dark:text-slate-200 group-hover:text-indigo-600 transition-colors">단순 시뮬레이션</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" name="bt_mode" value="optimize" class="w-4 h-4 text-purple-600 focus:ring-purple-500 cursor-pointer">
                            <span class="text-sm font-bold text-slate-700 dark:text-slate-200 group-hover:text-purple-600 transition-colors">파라미터 최적화 (승률 분석)</span>
                        </label>
                    </div>
                </div>
                
                <div class="w-full h-px bg-slate-200 dark:bg-slate-600"></div>

                <div class="flex flex-col sm:flex-row gap-6 items-center">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-slate-500 dark:text-slate-400">진입 일시:</span>
                    </div>
                    <div class="flex items-center gap-4 flex-grow">
                        <input type="datetime-local" id="global-datetime" step="1" class="p-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 dark:text-white text-sm font-mono cursor-pointer flex-grow sm:flex-grow-0 sm:w-64">
                        
                        <label class="flex items-center gap-2 cursor-pointer group" title="체크 시 날짜만 입력하며, 시간은 09:00:00(장시작)으로 고정됩니다.">
                            <input type="checkbox" id="simple-date-mode" onchange="toggleDateMode()" class="w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer rounded border-gray-300">
                            <span class="text-sm font-bold text-slate-600 dark:text-slate-300 group-hover:text-blue-600 transition-colors">시간 생략 (09:00 진입)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 items-center mb-2 px-1 select-none">
                <div class="w-full text-sm font-bold text-slate-500 dark:text-slate-400 pl-1">
                    종목명 (전 종목 검색) <span class="text-slate-300">|</span> 코드
                </div>
            </div>
            <div id="input-rows" class="space-y-3"></div>
            
            <datalist id="stock-list"></datalist>

            <div class="mt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-700 pt-4">
                <div class="flex gap-2">
                    <button onclick="addRow()" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 text-sm font-medium flex items-center gap-1 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        종목 추가
                    </button>
                    <button onclick="fillCapturedStocks()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm font-medium flex items-center gap-1 transition-colors">⚡ 포착 종목 적용</button>
                    <button onclick="fillTopMovers()" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 text-sm font-medium flex items-center gap-1 transition-colors">🔥 급등주 Top 10 적용</button>
                </div>
                
                <div class="flex items-center gap-3">
                    <p class="text-xs text-red-500 font-bold hidden sm:block text-right">
                        * 반드시 실전투자 API Key가 필요합니다.<br>(모의투자 계좌는 과거 차트 조회 불가)
                    </p>
                    <button onclick="runBacktest()" id="run-btn" class="px-6 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold flex items-center gap-2 shadow-lg shadow-indigo-500/30 transition-all active:scale-95">
                        <span>▶ 시뮬레이션 시작</span>
                    </button>
                    <!-- 🌟 [추가] 중지 버튼 -->
                    <button onclick="stopBacktest()" id="stop-btn" class="hidden px-6 py-2.5 bg-red-500 text-white rounded-lg hover:bg-red-600 font-bold flex items-center gap-2 shadow-lg shadow-red-500/30 transition-all active:scale-95">
                        <span>⏹ 중지</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div id="result-area" class="hidden bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6 border border-slate-200 dark:border-slate-700 animate-fade-in-down">
            <h2 class="text-lg font-semibold mb-4 flex justify-between items-center">
                📈 결과 리포트
                <span id="status-badge" class="text-xs px-2.5 py-1 bg-yellow-100 text-yellow-800 rounded-full font-medium">대기 중...</span>
            </h2>
            
            <div id="result-summary" class="mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4 text-center"></div>
            
            <div class="overflow-hidden rounded-lg border border-slate-200 dark:border-slate-700">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                            <tr>
                                <th class="p-3 font-semibold">종목명(코드)</th>
                                <th class="p-3 font-semibold">진입시간</th>
                                <th class="p-3 font-semibold text-right">진입가</th>
                                <th class="p-3 font-semibold">매도시간</th>
                                <th class="p-3 font-semibold text-right">매도가</th>
                                <th class="p-3 font-semibold text-center">수익률</th>
                                <th class="p-3 font-semibold w-1/4">매매 사유</th>
                                <th class="p-3 font-semibold text-center">차트</th> </tr>
                        </thead>
                        <tbody id="result-table" class="divide-y divide-slate-200 dark:divide-slate-600 bg-white dark:bg-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="chart-modal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-5xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 border-b border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-bold" id="modal-title">차트 보기</h3>
                <button onclick="closeChartModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 flex-grow overflow-hidden bg-slate-50 dark:bg-slate-900/50">
                <div id="chart-container" class="w-full h-[400px]"></div>
            </div>
        </div>
    </div>

    <script>
        let stockMap = {}; 
        let currentResults = []; // 결과 데이터 저장용
        let chartInstance = null; // 차트 인스턴스

        async function loadStockList() {
            try {
                const res = await fetch('/api/master_stocks');
                const data = await res.json();
                const datalist = document.getElementById('stock-list');
                datalist.innerHTML = '';
                
                if (data.stocks && data.stocks.length > 0) {
                    data.stocks.forEach(s => {
                        stockMap[s.name] = s.code; 
                        const option = document.createElement('option');
                        option.value = s.name; 
                        option.label = s.code; 
                        datalist.appendChild(option);
                    });
                }
            } catch (e) { console.error(e); }
        }
        loadStockList();

        function addRow() {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center animate-fade-in-down';
            
            div.innerHTML = `
                <div class="relative flex items-center gap-1 flex-grow">
                    <input type="text" list="stock-list" placeholder="종목명 검색..." 
                           class="name-input p-2 border border-slate-300 dark:border-slate-600 rounded-lg w-full bg-white dark:bg-slate-700 dark:text-white text-sm placeholder-slate-400"
                           oninput="updateCode(this)">
                    <input type="text" placeholder="코드" readonly 
                           class="code-input p-2 border border-slate-300 dark:border-slate-600 rounded-lg w-24 bg-slate-100 dark:bg-slate-600 text-slate-500 dark:text-slate-300 text-center text-sm font-mono cursor-default focus:outline-none">
                </div>
                <button onclick="removeRow(this)" class="text-slate-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;
            document.getElementById('input-rows').appendChild(div);
        }

        // 🌟 [추가] 데이터로 행 추가하는 함수
        function addFilledRow(name, code) {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center animate-fade-in-down';
            
            div.innerHTML = `
                <div class="relative flex items-center gap-1 flex-grow">
                    <input type="text" list="stock-list" placeholder="종목명 검색..." value="${name}"
                           class="name-input p-2 border border-slate-300 dark:border-slate-600 rounded-lg w-full bg-white dark:bg-slate-700 dark:text-white text-sm placeholder-slate-400"
                           oninput="updateCode(this)">
                    <input type="text" placeholder="코드" value="${code}" readonly 
                           class="code-input p-2 border border-slate-300 dark:border-slate-600 rounded-lg w-24 bg-slate-100 dark:bg-slate-600 text-slate-500 dark:text-slate-300 text-center text-sm font-mono cursor-default focus:outline-none">
                </div>
                <button onclick="removeRow(this)" class="text-slate-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;
            document.getElementById('input-rows').appendChild(div);
        }

        // 🌟 [추가] 조건검색 포착 종목 가져오기 함수
        async function fillCapturedStocks() {
            if(!confirm("현재 입력된 내용을 모두 지우고\n실시간 조건검색 포착 종목으로 채우시겠습니까?")) return;
            
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<div class="loader w-4 h-4 border-2 rounded-full border-t-transparent mr-2"></div> 조회 중...`;

            try {
                const res = await fetch('/api/current_conditions');
                const data = await res.json();
                
                if (data.stocks) {
                    document.getElementById('input-rows').innerHTML = ''; // 기존 내용 삭제
                    
                    if (data.stocks.length === 0) alert("현재 포착된 종목이 없습니다.");

                    data.stocks.forEach(stock => {
                        addFilledRow(stock.name, stock.code);
                    });
                } else {
                    alert("데이터 조회 실패");
                }
            } catch (e) { alert("통신 오류가 발생했습니다."); } 
            finally { btn.disabled = false; btn.innerHTML = originalText; }
        }

        // 🌟 [추가] 급등주 가져오기 함수
        async function fillTopMovers() {
            if(!confirm("현재 입력된 내용을 모두 지우고\n전일대비 등락률 상위 10개 종목으로 채우시겠습니까?")) return;
            
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<div class="loader w-4 h-4 border-2 rounded-full border-t-transparent mr-2"></div> 조회 중...`;

            try {
                const res = await fetch('/api/backtest/recommend');
                const data = await res.json();
                
                if (data.success && data.stocks) {
                    document.getElementById('input-rows').innerHTML = ''; // 기존 내용 삭제
                    
                    data.stocks.forEach(stock => {
                        addFilledRow(stock.name, stock.code);
                    });
                } else {
                    alert("데이터 조회 실패: " + (data.message || "알 수 없는 오류"));
                }
            } catch (e) { alert("통신 오류가 발생했습니다."); } 
            finally { btn.disabled = false; btn.innerHTML = originalText; }
        }

        function removeRow(btn) {
            btn.parentElement.remove();
        }

        function updateCode(input) {
            const name = input.value;
            const codeInput = input.nextElementSibling; 
            if (stockMap[name]) codeInput.value = stockMap[name];
            else if (/^\d{6}$/.test(name)) codeInput.value = name;
            else codeInput.value = ""; 
        }

        // 🌟 [추가] 날짜/시간 입력 모드 토글
        function toggleDateMode() {
            const isSimple = document.getElementById('simple-date-mode').checked;
            const input = document.getElementById('global-datetime');
            if(input) {
                const val = input.value;
                if(isSimple) {
                    input.type = 'date';
                    if(val.includes('T')) input.value = val.split('T')[0];
                } else {
                    input.type = 'datetime-local';
                    if(val && !val.includes('T')) input.value = `${val}T09:00:00`;
                }
            }
        }

        // 초기화
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('global-datetime').value = `${today}T09:00:00`;
        addRow();

        async function runBacktest() {
            const codeInputs = document.querySelectorAll('.code-input');
            const globalDatetime = document.getElementById('global-datetime').value;
            const mode = document.querySelector('input[name="bt_mode"]:checked').value; // 🌟 모드 값 가져오기
            
            const signals = [];
            for(let i=0; i<codeInputs.length; i++) {
                const code = codeInputs[i].value.trim();
                const rawDateTime = globalDatetime;
                if(code && rawDateTime) {
                    let datePart, timePart;
                    if(rawDateTime.includes('T')) {
                        [datePart, timePart] = rawDateTime.split('T');
                    } else {
                        datePart = rawDateTime;
                        timePart = "09:00:00"; // 시간 생략 시 기본값
                    }
                    const cleanDate = datePart.replace(/-/g, '');
                    let timeStr = timePart.replace(/:/g, '');
                    if(timeStr.length === 4) timeStr += '00';
                    signals.push([code, cleanDate, timeStr]);
                }
            }

            if(signals.length === 0) return alert("종목과 날짜를 입력해주세요.");

            const btn = document.getElementById('run-btn');
            const stopBtn = document.getElementById('stop-btn');
            const originalBtnContent = btn.innerHTML;
            
            btn.classList.add('hidden'); // 시작 버튼 숨김
            stopBtn.classList.remove('hidden'); // 중지 버튼 표시

            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('status-badge').textContent = "요청 중...";
            document.getElementById('result-table').innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-500">데이터 조회 및 시뮬레이션 중입니다...<br><span class="text-xs">(약 5~10초 소요)</span></td></tr>';

            try {
                const reqRes = await fetch('/api/backtest/request', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ signals, mode }) // 🌟 모드 전송
                });
                
                if(!reqRes.ok) throw new Error("요청 실패");

                // 폴링 시작
                let attempts = 0;
                const poll = setInterval(async () => {
                    attempts++;
                    if(attempts > 45) { clearInterval(poll); finish("시간 초과", false); return; }

                    const resRes = await fetch('/api/backtest/result?t=' + Date.now(), { 
                        cache: "no-store",
                        headers: { 'Pragma': 'no-cache' }
                    });
                    const data = await resRes.json();

                    if(data.status === 'complete') {
                        clearInterval(poll);
                        currentResults = data.results; // 차트 표시를 위해 저장
                        // 🌟 결과 타입에 따라 렌더링 분기
                        if (data.results && data.results.type === 'optimization') {
                            renderOptimizationResults(data.results.data);
                        } else {
                            renderResults(data.results);
                        }
                        finish("분석 완료", true);
                    } else {
                        document.getElementById('status-badge').textContent = `진행 중... (${attempts * 2}초)`;
                    }
                }, 2000);

            } catch(e) { finish("오류 발생", false); }

            function finish(msg, success) {
                btn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                const badge = document.getElementById('status-badge');
                badge.textContent = msg;
                badge.className = `text-xs px-2.5 py-1 rounded-full font-medium ${success ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            }
            
            // 🌟 [추가] 중지 함수를 전역 스코프에 노출 (클로저 문제 해결을 위해 window에 할당하거나 별도 함수로 분리)
            window.currentPoll = poll; // 폴링 인터벌 ID 저장
            window.finishBacktest = finish;
        }

        // 🌟 [추가] 중지 요청 함수
        async function stopBacktest() {
            if(!confirm("시뮬레이션을 강제 중지하시겠습니까?")) return;
            
            try {
                await fetch('/api/backtest/stop', { method: 'POST' });
                if(window.currentPoll) clearInterval(window.currentPoll);
                if(window.finishBacktest) window.finishBacktest("사용자 중지됨", false);
            } catch(e) {
                alert("중지 요청 실패");
            }
        }

        function renderResults(results) {

        // 🌟 [추가] 최적화 설정 적용 함수
        async function applyOptimizedSettings(params) {
            if(!confirm("이 파라미터 설정을 봇에 즉시 적용하시겠습니까?\n\n" + 
                `손절률: ${params.STOP_LOSS_RATE}%\n` +
                `익절시작: ${params.TRAILING_START_RATE}%\n` +
                `트레일링: ${params.TRAILING_STOP_RATE}%\n` +
                (params.RSI_LIMIT ? `RSI제한: ${params.RSI_LIMIT}\n` : 'RSI제한: 끄기\n') +
                (params.VOLUME_FILTER_RATIO ? `거래량필터: ${params.VOLUME_FILTER_RATIO}` : '거래량필터: 끄기')
            )) return;
            
            // 서버 전송용 데이터 가공
            const settings = { ...params };
            
            // 필터 사용 여부 플래그 설정
            settings.USE_RSI_FILTER = !!params.RSI_LIMIT;
            settings.USE_VOLUME_FILTER = !!params.VOLUME_FILTER_RATIO;
            if(!settings.RSI_LIMIT) settings.RSI_LIMIT = 70; // 기본값 복구
            if(!settings.VOLUME_FILTER_RATIO) settings.VOLUME_FILTER_RATIO = 0.3; // 기본값 복구

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                const data = await res.json();
                if(data.success) alert("✅ 설정이 성공적으로 적용되었습니다!");
                else alert("❌ 설정 적용 실패: " + data.message);
            } catch(e) {
                alert("❌ 통신 오류 발생");
            }
        }

        // 🌟 [핵심] 차트 팝업 표시
        function showChart(idx) {
            const res = currentResults[idx];
            if(!res || !res.chart_data || res.chart_data.length === 0) return alert("차트 데이터가 없습니다.");

            document.getElementById('chart-modal').classList.remove('hidden');
            const stockName = Object.keys(stockMap).find(key => stockMap[key] === res.stock_code) || res.stock_code;
            document.getElementById('modal-title').textContent = `${stockName} (${res.stock_code}) 백테스팅 결과`;

            // 데이터 가공
            const candleData = res.chart_data.map(c => {
                // time_str (YYYYMMDDHHMMSS) -> timestamp
                const t = c.time_str;
                if (!t || t.length < 12) return null;
                
                const date = new Date(
                    parseInt(t.slice(0,4)), 
                    parseInt(t.slice(4,6))-1, 
                    parseInt(t.slice(6,8)), 
                    parseInt(t.slice(8,10)), 
                    parseInt(t.slice(10,12)),
                    parseInt(t.slice(12,14) || 0) // 🌟 [수정] 초 단위까지 파싱
                );
                return {
                    x: date.getTime(),
                    y: [c.open, c.high, c.low, c.close]
                };
            }).filter(item => item !== null);

            // 🌟 [추가] 거래량 데이터 생성 (MTS 스타일 색상 적용)
            const volumeData = res.chart_data.map(c => {
                const t = c.time_str;
                if (!t || t.length < 12) return null;
                const date = new Date(
                    parseInt(t.slice(0,4)), 
                    parseInt(t.slice(4,6))-1, 
                    parseInt(t.slice(6,8)), 
                    parseInt(t.slice(8,10)), 
                    parseInt(t.slice(10,12)),
                    parseInt(t.slice(12,14) || 0)
                );
                const isUp = c.close >= c.open;
                const color = isUp ? '#ef4444' : '#3b82f6'; // 상승: 빨강, 하락: 파랑
                return { x: date.getTime(), y: c.volume, fillColor: color };
            }).filter(item => item !== null);

            // 🌟 [추가] EMA 계산 함수 (MACD용 정밀 계산)
            function calculateEMA(values, period) {
                const k = 2 / (period + 1);
                const emaArray = new Array(values.length).fill(null);
                
                let firstValidIdx = -1;
                for(let i=0; i<values.length; i++) {
                    if(values[i] !== null && values[i] !== undefined) { firstValidIdx = i; break; }
                }
                
                if(firstValidIdx === -1 || values.length - firstValidIdx < period) return emaArray;

                let sum = 0;
                for (let i = firstValidIdx; i < firstValidIdx + period; i++) {
                    sum += values[i];
                }
                emaArray[firstValidIdx + period - 1] = sum / period;

                for (let i = firstValidIdx + period; i < values.length; i++) {
                    emaArray[i] = (values[i] * k) + (emaArray[i - 1] * (1 - k));
                }
                return emaArray;
            }

            // 🌟 [추가] 이동평균선(MA) 계산 함수
            function calculateMA(data, period) {
                return data.map((item, index) => {
                    if (index < period - 1) return { x: item.x, y: null };
                    const slice = data.slice(index - period + 1, index + 1);
                    const sum = slice.reduce((acc, curr) => acc + curr.y[3], 0); // y[3] is Close price
                    return { x: item.x, y: sum / period };
                });
            }

            // MA 데이터 생성
            const ma5 = calculateMA(candleData, 5);
            const ma20 = calculateMA(candleData, 20);
            const ma60 = calculateMA(candleData, 60);
            const ma200 = calculateMA(candleData, 200);

            // 🌟 [추가] MACD 및 골든크로스 계산
            const closes = candleData.map(d => d.y[3]);
            const ema12 = calculateEMA(closes, 12);
            const ema26 = calculateEMA(closes, 26);
            
            const macdLine = closes.map((_, i) => {
                if (ema12[i] !== null && ema26[i] !== null) return ema12[i] - ema26[i];
                return null;
            });
            
            const signalLine = calculateEMA(macdLine, 9);
            
            // 골든크로스 감지 (MACD 상향 돌파)
            const goldenCrossPoints = [];
            for(let i = 1; i < macdLine.length; i++) {
                const currMacd = macdLine[i];
                const currSig = signalLine[i];
                const prevMacd = macdLine[i-1];
                const prevSig = signalLine[i-1];

                if (currMacd !== null && currSig !== null && prevMacd !== null && prevSig !== null) {
                    // 골든크로스: 이전엔 MACD <= Signal 이었다가, 현재 MACD > Signal
                    if (prevMacd <= prevSig && currMacd > currSig) {
                        goldenCrossPoints.push({
                            x: candleData[i].x,
                            y: candleData[i].y[2], // Low price (저가)
                        });
                    }
                }
            }

            // 매수/매도 시점 어노테이션
            const buyTimeStr = res.buy_time;
            const sellTimeStr = res.sell_time;
            
            // 🌟 [수정] X축(시간)과 Point(가격) 어노테이션 분리
            const xaxisAnnotations = [];
            const pointAnnotations = [];
            
            // 매수 지점
            if(buyTimeStr && buyTimeStr.length >= 12) {
                const bd = new Date(
                    parseInt(buyTimeStr.slice(0,4)), 
                    parseInt(buyTimeStr.slice(4,6))-1, 
                    parseInt(buyTimeStr.slice(6,8)), 
                    parseInt(buyTimeStr.slice(8,10)), 
                    parseInt(buyTimeStr.slice(10,12)),
                    parseInt(buyTimeStr.slice(12,14) || 0) // 🌟 [수정] 초 단위 반영
                );
                
                // 세로선 (시간)
                xaxisAnnotations.push({
                    x: bd.getTime(),
                    borderColor: '#22c55e',
                    label: { 
                        style: { color: '#fff', background: '#22c55e', padding: { left: 5, right: 5, top: 2, bottom: 2 } }, 
                        text: '매수',
                        orientation: 'horizontal',
                        offsetY: -20
                    },
                    strokeDashArray: 0
                });

                // 🌟 [추가] 점 (가격)
                pointAnnotations.push({
                    x: bd.getTime(),
                    y: res.buy_price,
                    marker: { size: 5, fillColor: '#22c55e', strokeColor: '#fff', radius: 2, cssClass: 'cursor-pointer' },
                    label: {
                        borderColor: '#22c55e',
                        style: { color: '#fff', background: '#22c55e', padding: { left: 5, right: 5, top: 2, bottom: 2 } },
                        text: `₩${res.buy_price.toLocaleString()}`,
                        offsetY: 30
                    }
                });
            }
            
            // 매도 지점
            if(sellTimeStr && sellTimeStr.length >= 12) {
                const sd = new Date(
                    parseInt(sellTimeStr.slice(0,4)), 
                    parseInt(sellTimeStr.slice(4,6))-1, 
                    parseInt(sellTimeStr.slice(6,8)), 
                    parseInt(sellTimeStr.slice(8,10)), 
                    parseInt(sellTimeStr.slice(10,12)),
                    parseInt(sellTimeStr.slice(12,14) || 0) // 🌟 [수정] 초 단위 반영
                );
                
                xaxisAnnotations.push({
                    x: sd.getTime(),
                    borderColor: '#ef4444',
                    label: { 
                        style: { color: '#fff', background: '#ef4444', padding: { left: 5, right: 5, top: 2, bottom: 2 } }, 
                        text: '매도',
                        orientation: 'horizontal',
                        offsetY: -20
                    },
                    strokeDashArray: 0
                });

                // 🌟 [추가] 점 (가격)
                pointAnnotations.push({
                    x: sd.getTime(),
                    y: res.sell_price,
                    marker: { size: 5, fillColor: '#ef4444', strokeColor: '#fff', radius: 2, cssClass: 'cursor-pointer' },
                    label: {
                        borderColor: '#ef4444',
                        style: { color: '#fff', background: '#ef4444', padding: { left: 5, right: 5, top: 2, bottom: 2 } },
                        text: `₩${res.sell_price.toLocaleString()}`,
                        offsetY: 30
                    }
                });
            }

            // 🌟 [추가] MACD 골든크로스 화살표 추가
            goldenCrossPoints.forEach(pt => {
                pointAnnotations.push({
                    x: pt.x,
                    y: pt.y,
                    marker: {
                        size: 0, // 마커 숨김 (텍스트로 대체)
                    },
                    label: {
                        borderColor: 'transparent',
                        style: {
                            color: '#00b894', // 초록색
                            background: 'transparent',
                            fontSize: '20px',
                            fontWeight: 'bold',
                        },
                        text: '⬆', // 위쪽 화살표
                        offsetY: 15 // 캔들 바로 밑에 위치
                    }
                });
            });

            const isDark = document.documentElement.classList.contains('dark');

            const options = {
                series: [
                    { name: '가격', type: 'candlestick', data: candleData },
                    { name: 'MA5', type: 'line', data: ma5 },
                    { name: 'MA20', type: 'line', data: ma20 },
                    { name: 'MA60', type: 'line', data: ma60 },
                    { name: 'MA200', type: 'line', data: ma200 },
                    { name: '거래량', type: 'bar', data: volumeData }
                ],
                chart: { 
                    type: 'candlestick', 
                    height: 600, 
                    toolbar: { show: true },
                    background: 'transparent',
                    animations: { enabled: false }
                },
                title: { 
                    text: `수익률: ${res.profit_rate}% (${res.sell_reason})`, 
                    align: 'left',
                    style: { color: isDark ? '#cbd5e1' : '#334155' }
                },
                xaxis: { 
                    type: 'datetime',
                    tooltip: { enabled: true },
                    labels: { 
                        datetimeFormatter: { year: 'yyyy', month: "MMM 'yy", day: 'dd MMM', hour: 'HH:mm' },
                        style: { colors: isDark ? '#94a3b8' : '#64748b' }
                    },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: [
                    {
                        seriesName: '가격',
                        height: '75%',
                        tooltip: { enabled: true },
                        labels: {
                            formatter: (value) => value.toLocaleString(),
                            style: { colors: isDark ? '#94a3b8' : '#64748b' }
                        }
                    },
                    { seriesName: '가격', show: false, height: '75%' },
                    { seriesName: '가격', show: false, height: '75%' },
                    { seriesName: '가격', show: false, height: '75%' },
                    { seriesName: '가격', show: false, height: '75%' },
                    {
                        seriesName: '거래량',
                        top: '75%',

                        offsetY: 0,
                        labels: { show: false },
                        tooltip: { enabled: false }
                    }
                ],
                grid: {
                    borderColor: isDark ? '#334155' : '#e2e8f0',
                    strokeDashArray: 4,
                },
                stroke: {
                    width: [1, 1.5, 1.5, 1.5, 1.5],
                    curve: 'smooth'
                },
                colors: ['#000000', '#22c55e', '#ef4444', '#f97316', '#a855f7'], // 캔들(무시됨), 녹색, 빨강, 주황, 보라
                plotOptions: {
                    candlestick: {
                        colors: {
                            upward: '#ef4444',   // 빨강
                            downward: '#3b82f6'  // 파랑
                        },
                        wick: { useFillColor: true }
                    }
                },
                annotations: { 
                    xaxis: xaxisAnnotations,
                    points: pointAnnotations
                },
                tooltip: { 
                    theme: isDark ? 'dark' : 'light',
                    x: { format: 'yyyy-MM-dd HH:mm:ss' }, // 툴팁 포맷도 초 단위 추가
                    shared: true
                }
            };

            if(chartInstance) chartInstance.destroy();
            chartInstance = new ApexCharts(document.querySelector("#chart-container"), options);
            chartInstance.render();
        }

        function closeChartModal() {
            document.getElementById('chart-modal').classList.add('hidden');
        }

        // 다크모드 설정
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function setTheme(isDark) {
            if (isDark) { 
                document.documentElement.classList.add('dark'); 
                lightIcon.classList.remove('hidden'); 
                darkIcon.classList.add('hidden'); 
            } else { 
                document.documentElement.classList.remove('dark'); 
                darkIcon.classList.remove('hidden'); 
                lightIcon.classList.add('hidden'); 
            }
        }

        const isDarkMode = localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        setTheme(isDarkMode);

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');
            setTheme(!isDark);
            localStorage.setItem('color-theme', !isDark ? 'dark' : 'light');
            
            // 차트가 열려있다면 테마 변경 반영을 위해 닫기 (재오픈 시 적용됨)
            if(!document.getElementById('chart-modal').classList.contains('hidden')) {
                closeChartModal();
            }
        });
    </script>
</body>
</html>
